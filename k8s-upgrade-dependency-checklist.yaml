# k8s-upgrade-dependency-checklist.yaml

cluster:
  current_version: "1.34"
  target_version: "1.35"
  environment: "production"

dependencies:

  kubernetes:
    check:
      - kubectl version --short
      - kubectl cluster-info

  nodes:
    check:
      - kubectl get nodes -o wide
      - kubectl describe nodes

  pods:
    check:
      - kubectl get pods -A
      - kubectl get pods -A | egrep 'CrashLoopBackOff|Error|Pending'

  apis:
    check:
      - kubectl api-resources
      - kubectl get apiservices

  deprecated_apis:
    check:
      - kubectl get --raw /metrics | grep apiserver_requested_deprecated_apis

  crds:
    check:
      - kubectl get crds

  helm:
    check:
      - helm version
      - helm list -A
      - helm repo list

  ingress_controller:
    namespace: ingress-nginx
    check:
      - kubectl get pods -n ingress-nginx
      - kubectl get svc -n ingress-nginx

  cni_plugin:
    check:
      - kubectl get pods -n kube-system
      - kubectl get daemonset -n kube-system

  csi_drivers:
    check:
      - kubectl get csidrivers
      - kubectl get storageclass

  persistent_storage:
    check:
      - kubectl get pv
      - kubectl get pvc -A

  metrics_server:
    check:
      - kubectl top nodes
      - kubectl top pods -A

  dns:
    check:
      - kubectl get pods -n kube-system -l k8s-app=kube-dns

  kube_proxy:
    check:
      - kubectl get ds -n kube-system kube-proxy

  admission_webhooks:
    check:
      - kubectl get validatingwebhookconfigurations
      - kubectl get mutatingwebhookconfigurations

  rbac:
    check:
      - kubectl get clusterroles
      - kubectl get clusterrolebindings

  etcd:
    check:
      - kubectl get pods -n kube-system -l component=etcd
      - etcdctl endpoint health

  namespaces:
    check:
      - kubectl get ns

  events:
    check:
      - kubectl get events -A --sort-by=.metadata.creationTimestamp

  backups:
    check:
      - echo "Verify ETCD snapshot backup"
      - echo "Verify Velero/application backup"

post_upgrade_validation:

  cluster_health:
    check:
      - kubectl version --short
      - kubectl get componentstatus

  node_validation:
    check:
      - kubectl get nodes -o wide

  system_pods:
    check:
      - kubectl get pods -n kube-system

  application_pods:
    check:
      - kubectl get pods -A

  ingress_validation:
    check:
      - kubectl get ingress -A

  dns_validation:
    check:
      - kubectl run dns-test --image=busybox:1.36 --rm -it -- nslookup kubernetes.default

  storage_validation:
    check:
      - kubectl get pvc -A

  metrics_validation:
    check:
      - kubectl top nodes

recommendations:
  - Take ETCD snapshot before upgrade
  - Validate deprecated APIs before upgrading
  - Upgrade Helm charts to supported versions
  - Verify CSI/CNI plugin compatibility with Kubernetes 1.35
  - Test upgrade in staging cluster first
  - Monitor workloads after upgrade
  - Review Kubernetes 1.35 release notes
